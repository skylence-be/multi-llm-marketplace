[package]
name = "org-relay"
version = "0.5.0"
edition = "2021"
description = "Durable MCP message bus for the herdr agent-org: queue + long-poll await, plus a nudge watchdog that rings recipients whose backlog has no listener."

[workspace]

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
strip = true
